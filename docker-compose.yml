services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: landing
      POSTGRES_PASSWORD: landing
      POSTGRES_DB: landing
    ports:
      - "5432:5432"
    volumes:
      - events-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landing -d landing"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      DATABASE_URL: postgres://landing:landing@db:5432/landing
      SITE_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  events-data:
